[project]
name = "media-manager"
version = "0.1.0"
description = "A bounded, self-hosted media converter for the web and mobile automations"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "aiofiles==24.1.0",
    "fastapi==0.141.1",
    "PyJWT[crypto]==2.13.0",
    "uvicorn==0.35.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.12.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/media_manager"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = ["integration: requires local FFmpeg and ffprobe executables"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
