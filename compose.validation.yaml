# Disposable workflow validation only. No host ports or external ingress.
services:
  fixture:
    image: media-manager:workflow-validation
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mkdir -p /fixtures
        ffmpeg -hide_banner -loglevel error \
          -f lavfi -i testsrc2=size=1280x720:rate=24 \
          -f lavfi -i sine=frequency=440:sample_rate=44100 \
          -t 8 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest -y /fixtures/source.mp4
        ffmpeg -hide_banner -loglevel error \
          -f lavfi -i sine=frequency=660:sample_rate=44100 \
          -t 8 -c:a pcm_s16le -y /fixtures/source.wav
        ffmpeg -hide_banner -loglevel error \
          -f lavfi -i color=c=steelblue:s=320x200 -frames:v 1 -y /fixtures/cover.jpg
        cat > /fixtures/index.html <<'HTML'
        <!doctype html>
        <html><head><title>Synthetic workflow clip</title>
        <meta property="og:image" content="http://fixture:8082/cover.jpg"></head>
        <body><video poster="http://fixture:8082/cover.jpg" controls>
        <source src="http://fixture:8082/source.mp4" type="video/mp4" width="1280" height="720" label="720p">
        </video></body></html>
        HTML
        for index in 01 02 03 04 05 06 07 08 09 10 11 12; do
          cp /fixtures/source.mp4 "/fixtures/source-$${index}.mp4"
          cp /fixtures/cover.jpg "/fixtures/cover-$${index}.jpg"
          sed "s#source.mp4#source-$${index}.mp4#g; s#cover.jpg#cover-$${index}.jpg#g" \
            /fixtures/index.html > "/fixtures/page-$${index}.html"
        done
        exec python3 -m http.server 8082 --directory /fixtures
    volumes:
      - fixtures:/fixtures
    networks: [validation]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=16m"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/index.html', timeout=2).read()"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s

  metube:
    image: ghcr.io/alexta69/metube@sha256:8e2fe9beeefc55a02f6e1d04cad0fc3c22e8f067d309188f016551dc99ec27b3
    environment:
      MAX_CONCURRENT_DOWNLOADS: "1"
      LOGLEVEL: WARNING
      ALLOW_PRIVATE_ADDRESSES: "true"
    volumes:
      - downloads:/downloads
    networks: [validation]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN]
    mem_limit: 768m
    cpus: 0.75

  sidecar:
    image: ${WORKFLOW_SIDECAR_IMAGE:?The validator assigns a unique synthetic image tag}
    build:
      context: ../metube-sidecar
      dockerfile: Dockerfile
    environment:
      METUBE_URL: http://metube:8081
      DOWNLOADS_DIR: /downloads
      DATA_DIR: /data
      STABLE_SECONDS: "1"
      JOB_TIMEOUT_SECONDS: "120"
      METUBE_TIMEOUT_SECONDS: "10"
      SIDECAR_API_KEY: synthetic-workflow-validation-key
    volumes:
      - downloads:/downloads:ro
      - sidecar-data:/data
    networks: [validation]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=16m,uid=10001,gid=10001,mode=1777"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 128
    mem_limit: 192m
    cpus: 0.35
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).read()"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  api:
    image: media-manager:workflow-validation
    environment:
      MEDIA_MANAGER_AUTH_MODE: disabled
      MEDIA_MANAGER_PUBLIC_BASE_URL: http://api:8080
      MEDIA_MANAGER_WORK_DIR: /work
      MEDIA_MANAGER_MAX_UPLOAD_BYTES: "10485760"
      MEDIA_MANAGER_MAX_OUTPUT_BYTES: "10485760"
      MEDIA_MANAGER_MAX_CHUNK_BYTES: "1048576"
      MEDIA_MANAGER_MAX_LIVE_JOBS: "1"
      MEDIA_MANAGER_RESULT_TTL_SECONDS: ${WORKFLOW_RESULT_TTL_SECONDS:-604800}
      MEDIA_MANAGER_UPLOAD_SESSION_TTL_SECONDS: "1800"
      MEDIA_MANAGER_CLEANUP_INTERVAL_SECONDS: "2"
      MEDIA_MANAGER_UPLOAD_TIMEOUT_SECONDS: "30"
      MEDIA_MANAGER_PROBE_TIMEOUT_SECONDS: "10"
      MEDIA_MANAGER_MAX_DURATION_SECONDS: "60"
      MEDIA_MANAGER_FFMPEG_THREADS: "2"
      MEDIA_MANAGER_METUBE_SIDECAR_URL: http://sidecar:8080
      MEDIA_MANAGER_METUBE_SIDECAR_API_KEY: synthetic-workflow-validation-key
    volumes:
      - work:/work
    networks: [validation]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=1777"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 128
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 2.0
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=2).read()"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  check:
    image: media-manager:workflow-validation
    entrypoint: ["/app/.venv/bin/python", "/validation/validate_workflows.py"]
    command: ["check"]
    environment:
      WORKFLOW_API_URL: http://api:8080
      WORKFLOW_FIXTURE_URL: http://fixture:8082
      WORKFLOW_SIDECAR_URL: http://sidecar:8080
      WORKFLOW_SIDECAR_KEY: synthetic-workflow-validation-key
    volumes:
      - ./scripts/validate_workflows.py:/validation/validate_workflows.py:ro
      - fixtures:/fixtures:ro
      - work:/work
      - validation-state:/validation-state
      - downloads:/downloads:ro
    networks: [validation]
    depends_on:
      fixture:
        condition: service_healthy
      api:
        condition: service_healthy
      sidecar:
        condition: service_healthy
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    user: "0:0"
    mem_limit: 256m
    cpus: 0.5

networks:
  validation:
    internal: true

volumes:
  fixtures:
  downloads:
  sidecar-data:
  work:
  validation-state:
